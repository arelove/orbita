name: Build pdu binaries

on:
  workflow_dispatch:  # запуск вручную с кнопки в GitHub

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: pdu
            output: pdu-x86_64-unknown-linux-gnu

          - os: macos-latest
            target: x86_64-apple-darwin
            binary: pdu
            output: pdu-x86_64-apple-darwin

          - os: macos-latest
            target: aarch64-apple-darwin
            binary: pdu
            output: pdu-aarch64-apple-darwin

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: pdu.exe
            output: pdu-x86_64-pc-windows-msvc.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build pdu
        run: cargo install parallel-disk-usage --target ${{ matrix.target }} --root ./out

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: out/bin/${{ matrix.binary }}
