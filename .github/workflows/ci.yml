name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PDU_VERSION: "0.24.0"

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            pdu_target: x86_64-unknown-linux-gnu
            pdu_ext: ''
          - os: macos-latest
            pdu_target: aarch64-apple-darwin
            pdu_ext: ''
          - os: windows-latest
            pdu_target: x86_64-pc-windows-msvc
            pdu_ext: '.exe'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev

      - name: Download pdu binary (Linux & Windows)
        if: matrix.os != 'macos-latest'
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          curl -sSfL \
            "https://github.com/KSXGitHub/parallel-disk-usage/releases/download/${{ env.PDU_VERSION }}/pdu-${{ matrix.pdu_target }}${{ matrix.pdu_ext }}" \
            -o "src-tauri/bin/pdu-${{ matrix.pdu_target }}${{ matrix.pdu_ext }}"
          chmod +x "src-tauri/bin/pdu-${{ matrix.pdu_target }}" || true

      - name: Build pdu binary (macOS aarch64 — no prebuilt available)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          cargo install parallel-disk-usage \
            --version ${{ env.PDU_VERSION }} \
            --target aarch64-apple-darwin \
            --root ./pdu-out
          cp pdu-out/bin/pdu src-tauri/bin/pdu-aarch64-apple-darwin
          chmod +x src-tauri/bin/pdu-aarch64-apple-darwin

      - name: Install npm deps
        run: npm ci

      - name: Svelte check
        run: npm run check

      - name: Rust check
        working-directory: src-tauri
        run: cargo check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings