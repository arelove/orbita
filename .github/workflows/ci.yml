name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PDU_VERSION: "0.21.1"

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            pdu_target: x86_64-unknown-linux-gnu
          - os: macos-latest
            pdu_target: aarch64-apple-darwin
          - os: windows-latest
            pdu_target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev

      - name: Download pdu binary
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          TARGET="${{ matrix.pdu_target }}"
          if [[ "$TARGET" == *"windows"* ]]; then
            EXT=".exe"
          else
            EXT=""
          fi
          curl -sSfL \
            "https://github.com/KSXGitHub/parallel-disk-usage/releases/download/${{ env.PDU_VERSION }}/pdu-${TARGET}${EXT}" \
            -o "src-tauri/bin/pdu-${TARGET}${EXT}"
          chmod +x "src-tauri/bin/pdu-${TARGET}${EXT}" || true

      - name: Install npm deps
        run: npm ci

      - name: Svelte check
        run: npm run check

      - name: Rust check
        working-directory: src-tauri
        run: cargo check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings