name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PDU_VERSION: "0.21.1"

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
            pdu_target: x86_64-unknown-linux-gnu
            args: ''
          - platform: macos-x86_64
            runner: macos-13
            pdu_target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - platform: macos-aarch64
            runner: macos-latest
            pdu_target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: windows-x86_64
            runner: windows-latest
            pdu_target: x86_64-pc-windows-msvc
            args: ''

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system deps (Linux)
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev

      - name: Download pdu binary
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          TARGET="${{ matrix.pdu_target }}"
          if [[ "$TARGET" == *"windows"* ]]; then
            EXT=".exe"
          else
            EXT=""
          fi
          curl -sSfL \
            "https://github.com/KSXGitHub/parallel-disk-usage/releases/download/${{ env.PDU_VERSION }}/pdu-${TARGET}${EXT}" \
            -o "src-tauri/bin/pdu-${TARGET}${EXT}"
          chmod +x "src-tauri/bin/pdu-${TARGET}${EXT}" || true

      - name: Install npm deps
        run: npm ci

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Orbita ${{ github.ref_name }}
          releaseBody: |
            See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}