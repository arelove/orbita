name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PDU_VERSION: "0.24.0"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
            pdu_target: x86_64-unknown-linux-gnu
            pdu_ext: ''
            pdu_prebuilt: true
            args: ''
          - platform: macos-x86_64
            runner: macos-13
            pdu_target: x86_64-apple-darwin
            pdu_ext: ''
            pdu_prebuilt: true
            args: '--target x86_64-apple-darwin'
          - platform: macos-aarch64
            runner: macos-latest
            pdu_target: aarch64-apple-darwin
            pdu_ext: ''
            pdu_prebuilt: false
            args: '--target aarch64-apple-darwin'
          - platform: windows-x86_64
            runner: windows-latest
            pdu_target: x86_64-pc-windows-msvc
            pdu_ext: '.exe'
            pdu_prebuilt: true
            args: ''

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system deps (Linux)
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev

      - name: Download pdu binary (prebuilt)
        if: matrix.pdu_prebuilt == true
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          curl -sSfL \
            "https://github.com/KSXGitHub/parallel-disk-usage/releases/download/${{ env.PDU_VERSION }}/pdu-${{ matrix.pdu_target }}${{ matrix.pdu_ext }}" \
            -o "src-tauri/bin/pdu-${{ matrix.pdu_target }}${{ matrix.pdu_ext }}"
          chmod +x "src-tauri/bin/pdu-${{ matrix.pdu_target }}" || true

      - name: Build pdu binary (macOS aarch64 — no prebuilt available)
        if: matrix.pdu_prebuilt == false
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          cargo install parallel-disk-usage \
            --version ${{ env.PDU_VERSION }} \
            --target aarch64-apple-darwin \
            --root ./pdu-out
          cp pdu-out/bin/pdu src-tauri/bin/pdu-aarch64-apple-darwin
          chmod +x src-tauri/bin/pdu-aarch64-apple-darwin

      - name: Install npm deps
        run: npm ci

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Orbita ${{ github.ref_name }}
          releaseBody: |
            See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}